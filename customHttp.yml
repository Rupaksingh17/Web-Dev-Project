customHeaders:
  - pattern: '**'
    headers:
      - key: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      - key: X-Content-Type-Options
        value: nosniff
      - key: X-Frame-Options
        value: DENY
      - key: Referrer-Policy
        value: strict-origin-when-cross-origin
      - key: Permissions-Policy
        value: geolocation=(self), camera=(), microphone=()
      - key: Content-Security-Policy
        value: "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.s3.ap-southeast-2.amazonaws.com; connect-src 'self' https://uf13q7g0ij.execute-api.ap-southeast-2.amazonaws.com https://civicsignal-060065238859-ap-southeast-2.auth.ap-southeast-2.amazoncognito.com https://*.s3.ap-southeast-2.amazonaws.com; font-src 'self' data:"
